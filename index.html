<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Doom Version</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="screen-container">
        
        <picture id="start-bg">
            <source media="(max-width: 768px)" srcset="https://res.cloudinary.com/dbadhyp7x/image/upload/v1792662314/Gemini_Generated_Image_7q0a337q0a337q0a_apnxwe.jpg">
            <img src="https://res.cloudinary.com/dbadhyp7x/image/upload/v1792400909/Gemini_Generated_Image_emhypgemhypgemhy_1_oxqgyx.jpg" alt="Pokemon Doom Version Background" class="background-image">
        </picture>

        <picture id="players-bg" class="hidden">
            <source media="(max-width: 768px)" srcset="https://res.cloudinary.com/dbadhyp7x/image/upload/v1793010115/Paisaje_Pixelado_Bajo_el_Sol_xrwzjh.png">
            <img src="https://res.cloudinary.com/dbadhyp7x/image/upload/v1793007613/image_10_qsruzy.png" alt="Players Screen Background" class="background-image">
        </picture>

        <button id="start-btn" class="start-button">
            <div id="progress-bar" class="progress-bar"></div>
            <span class="start-text">START</span>
        </button>

        <div id="players-screen" class="players-screen hidden">
            <div class="top-bar">
                <button id="back-btn" class="back-btn">←</button>
                <div class="step-badge">PASO 1 DE 2</div>
            </div>

            <div class="players-card">
                <div class="card-left">
                    <h2 class="card-title">¿Quién juega?</h2>
                    <p class="card-subtitle">Añade 16 nombres. Cada uno se llevará un Pokémon al azar.</p>

                    <div class="input-group">
                        <input type="text" id="player-input" class="player-input" placeholder="Escribe un nombre" maxlength="12">
                        <button id="add-player-btn" class="add-player-btn">+</button>
                    </div>

                    <div id="error-message" class="error-message hidden">¡ERROR! MÁXIMO 16 JUGADORES</div>
                </div>

                <div class="card-right">
                    <div class="progress-info">
                        <span>NOMBRES</span>
                        <span id="players-counter">0/16</span>
                    </div>

                    <div id="segments-bar" class="segments-bar"></div>

                    <div id="names-grid" class="names-grid"></div>
                </div>
            </div>

            <div class="bottom-actions">
                <button id="fill-examples-btn" class="action-btn secondary-btn">RELLENAR CON EJEMPLOS</button>
                <button id="start-game-btn" class="action-btn primary-btn">COMENZAR · FALTAN 16</button>
            </div>
        </div>

        <div id="shadow-overlay" class="shadow-overlay"></div>

        <div id="cookie-banner" class="cookie-banner">
            <p>A WILD COOKIE NOTICE APPEARED!<br><br>THIS SITE USES COOKIES TO SAVE YOUR GAME. WHAT SHOULD THE PLAYER DO?</p>
            <div class="cookie-buttons">
                <button id="btn-accept" class="cookie-btn">ACCEPT</button>
                <button id="btn-deny" class="cookie-btn">RUN</button>
            </div>
        </div>

        <audio id="loading-audio" src="sonido-start.mp3" preload="auto"></audio>
        <audio id="background-audio" src="tema-fondo.mp3" loop preload="auto"></audio>
        <audio id="players-audio" src="bg-ost.mp3" loop preload="auto"></audio>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
