
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Doom - Pantalla Final</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
        rel="stylesheet"
    >
</head>

<body>
    <main id="final-screen" class="final-screen">
        <img
            class="final-background"
            src="https://res.cloudinary.com/dbadhyp7x/image/upload/v1793010115/Paisaje_Pixelado_Bajo_el_Sol_xrwzjh.png"
            alt=""
        >
        <div class="final-notch"></div>

        <div class="final-content">
            <h1 class="final-title">¡COMPLETO!</h1>
            <div class="final-board">

                <div id="final-grid" class="final-grid">
                </div>

            </div>
            <div class="final-actions">

                <button
                    id="play-again-btn"
                    class="final-btn final-btn-primary"
                    type="button"
                >
                    JUGAR OTRA VEZ
                </button>

                <button
                    id="copy-results-btn"
                    class="final-btn final-btn-secondary"
                    type="button"
                >
                    COPIAR RESULTADOS
                </button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
